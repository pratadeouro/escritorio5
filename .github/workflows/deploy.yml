name: Auto Deploy - Homogolacao

on:
  push:
    branches:
      - teste

concurrency:
  group: production
  cancel-in-progress: true

jobs: 
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

          set -e

          cd /home/auto/escritorio5teste
  
          echo "Atualizando código..."
          git fetch origin
          git reset --hard origin/teste

          echo "Instalando dependências..."
          npm install

          echo "Build do frontend..."
          npm run build

          echo "Reiniciando backend..."
          pm2 restart escritorio-teste-backend

          echo "Salvando configuração..."
          pm2 save

          echo "Deploy finalizado!"

          EOF